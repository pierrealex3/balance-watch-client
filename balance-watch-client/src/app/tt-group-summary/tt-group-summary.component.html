<div class="container">
    <table class="table table-hover table-striped table-dark">
        <thead>
            <th>Type</th>
            <th>Amount</th>
            <th>Debit or Credit</th>
            <th>Note</th>
            <th>Frequency</th>
        </thead>
        <tbody>
            <tr *ngFor="let tt of allTT" (click)="ttSelect(tt)">
                <td>{{tt.data.type}}</td>
                <td>{{tt.data.amount | currency}}</td>
                <td>{{tt.data.way}}</td>
                <td>{{tt.data.note}}</td>
                <td>{{tt.data.frequency}} | {{tt.freqRef?.description}}</td>
            </tr>
        </tbody>
        
    </table>
</div>
