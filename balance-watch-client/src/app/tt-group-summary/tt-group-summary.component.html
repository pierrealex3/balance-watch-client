<div class="container form-group" style="margin-top: 30px; padding-left: 0px; padding-right: 0px">
    <label for="summaryTable">Transaction Canvas Summary</label>
    <table id="summaryTable" class="table table-hover table-striped table-dark">
        <thead>
            <th>Type</th>
            <th>Amount</th>
            <th>Debit or Credit</th>
            <th>Note</th>
            <th>Frequency</th>
        </thead>
        <tbody>
            <tr *ngFor="let tt of allTT" (click)="ttSelect(tt)">
                <td>{{tt.data.type}}</td>
                <td>{{tt.data.amount | currency}}</td>
                <td>{{tt.data.way}}</td>
                <td>{{tt.data.note}}</td>
                <td>{{getDescriptor(tt)}}</td>
            </tr>
        </tbody>
        
    </table>
</div>
