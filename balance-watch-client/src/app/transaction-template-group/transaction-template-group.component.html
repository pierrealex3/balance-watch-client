<br />
<div class="container">
    <label>Transaction Template Name</label>
    <input [(ngModel)]="name" />
</div>

<div class="container">
    <div class="row">
        <div class="col-md-6">
            <label>Type</label>
        </div>
        <div class="col-md-6">
            <input [(ngModel)]="activeTT.type" />
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <label>Amount</label>
        </div>
        <div class="col-md-6">
            <input [(ngModel)]="activeTT.amount" />
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <label>Credit or Debit</label>
        </div>
        <div class="col-md-6">
            <select [(ngModel)]="activeTT.way">
                <option></option>
                <option value="CREDIT">Credit</option>
                <option value="DEBIT">Debit</option>
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <label>Frequency</label>
        </div>
        <div class="col-md-6">
            <select [(ngModel)]="freqSel">
                <option></option>
                <option value="em-dom">Every month - on a specific day</option>
            </select>            
        </div>
    </div>
    <div *ngIf="freqSel === 'em-dom'" class="row">
        <div class="col-md-6">
            <label>Which day?</label>
        </div>
        <div class="col-md-6">
            <input [(ngModel)]="activeTT.frequency" placeholder="dayOfMonth=4"/>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <label>Note</label>
        </div>
        <div class="col-md-6">
            <input [(ngModel)]="activeTT.note" />
        </div>
    </div>
</div>
<div class="container">
    <button (click)="saveActiveTT()">Add</button>
    <button (click)="clearFields()">Clear</button>
</div>

<div id="ttGroupSummary">
    <table>
        <thead>
            <th>Type</th>
            <th>Amount</th>
            <th>Way</th>
            <th>Note</th>
            <th>Frequency</th>
        </thead>
        <tbody>
            <tr *ngFor="let tt of listOfTT" (click)="editTT(tt)">
                <td>{{tt.type}}</td>
                <td>{{tt.amount}}</td>
                <td>{{tt.way}}</td>
                <td>{{tt.note}}</td>
                <td>{{tt.frequency}}</td>
            </tr>
        </tbody>

    </table>
</div>

<div>
    <button (click)="saveTTGroup()">Generate Template</button>
</div>
