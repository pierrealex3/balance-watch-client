<div class="spacer5"></div>
<div class="row">
    <div class="col-md-6">
        <label>Which month?</label>
    </div>
    <div class="col-md-6">
        <select class="form-control" [(ngModel)]="month" (change)="monthChange()">
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>
    </div>
</div>
<div class="spacer5"></div>
<div class="row">
    <div class="col-md-6">
        <label>Which day?</label>
    </div>
    <!-- who said event bubbling here... thanks jQuery -->
    <div class="col-md-6" (change)="dayChange()">        
        <select *ngIf="isThirtyDayMonth()" class="form-control" [(ngModel)]="day">
            <option *ngFor="let i of thirtyDayMonth">
                {{i}}
            </option>
        </select>
        <select *ngIf="isThirtyOneDayMonth()" class="form-control" [(ngModel)]="day">
            <option *ngFor="let i of thirtyOneDayMonth">
                {{i}}
            </option>
        </select>
        <select *ngIf="isTwentyNineDayMonth()" class="form-control" [(ngModel)]="day">
            <option *ngFor="let i of twentyNineDayMonth">
                {{i}}
            </option>
        </select>
    </div>
</div>
