<div class="container form-group" style="margin-top:15px; padding-left: 0px; padding-right: 0px">
    <label for="ttgNameId">Transaction Canvas Name</label>
    <input id="ttgNameId" class="form-control" [(ngModel)]="name"/>
</div>

<div class="container" style="border-style: dotted; border-width:thin; padding-top: 10px; padding-bottom: 10px;">
    <div class="row">
        <pre>{{activeTT?.data | json}}</pre>
    </div>
    <div [hidden]="displayErrBox == false" class="alert alert-danger">
        Fill all required fields and resubmit.
    </div>
    <div class="row">
        <div class="col-md-6">
            <label for="ttTypeId">Type</label>
        </div>
        <div class="col-md-6">
            <input id="ttTypeId" class="form-control" [(ngModel)]="activeTT.data.type" required #hookType="ngModel"/>
        </div>
    </div>
    <div class="spacer5"></div>
    <div class="row">
        <div class="col-md-6">
            <label for="ttAmtId">Amount</label>
        </div>
        <div class="col-md-6">
            <input id="ttAmtId" class="form-control" [(ngModel)]="activeTT.data.amount" required pattern="\d+(\.\d{2})?" #hookAmount="ngModel" />
        </div>
    </div>
    <div class="spacer5"></div>
    <div class="row">
        <div class="col-md-6">
            <label for="ttWayId">Credit or Debit</label>
        </div>
        <div class="col-md-6">
            <select id="ttWayId" class="form-control" [(ngModel)]="activeTT.data.way" required #hookWay="ngModel">
                <option></option>
                <option value="CREDIT">Credit</option>
                <option value="DEBIT">Debit</option>
            </select>
        </div>
    </div>
    <div class="spacer5"></div>
    <div class="row">
        <div class="col-md-6">
            <label for="ttFreqSelId">Frequency</label>
        </div>
        <div class="col-md-6">
            <select id="ttFreqSelId" class="form-control" [(ngModel)]="activeTT.freqRef" (change)="onFrequencySelectionChange()">
                <option *ngFor="let ff of frequencyList" [ngValue]="ff" >{{ff.description}}</option>
            </select>            
        </div>
    </div>
    <div *ngIf="activeTT.freqRef?.code === 'em-dom'">
        <app-emdom [activeTT]="activeTT"></app-emdom>
    </div>
    <div *ngIf="activeTT.freqRef?.code === 'ew-dow'">
        <app-ewdow [activeTT]="activeTT"></app-ewdow>
    </div>
    <div *ngIf="activeTT.freqRef?.code === 'exw-dow'">
        <app-exwdow [activeTT]="activeTT"></app-exwdow>
    </div>
    <div *ngIf="activeTT.freqRef?.code === 'em-domwr'">
        <app-emdomwr [activeTT]="activeTT"></app-emdomwr>
    </div>
    <div *ngIf="activeTT.freqRef?.code === 'em-dowadom'">
        <app-emdowadom [activeTT]="activeTT"></app-emdowadom>
    </div>
    <div *ngIf="activeTT.freqRef?.code === 'ey-doy'">
        <app-eydoy [activeTT]="activeTT"></app-eydoy>
    </div>
    <div class="spacer5"></div>
    <div class="row">
        <div class="col-md-6">
            <span><label>Note</label><label style="font-style: italic;">&nbsp;(optional)</label></span>
        </div>
        <div class="col-md-6">
            <input class="form-control" [(ngModel)]="activeTT.data.note" />
        </div>
    </div>
    <div class="spacer5"></div>
    <button class="btn btn-primary" *ngIf="activeTTExists()" style="margin-right: 10px" (click)="saveActiveTT(hookType, hookAmount, hookWay)">Update</button>
    <button class="btn btn-primary" *ngIf="!activeTTExists()" style="margin-right: 10px" (click)="saveActiveTT(hookType, hookAmount, hookWay)">Add</button>
    <button class="btn btn-primary" (click)="clearFields()">Clear</button>
</div>

<app-tt-group-summary [allTT]="listOfTT" (ttSelected)=editTT($event)></app-tt-group-summary>

<div class="container" style="padding-left: 0px; padding-right: 0px">
    <a class="btn btn-primary" style="margin-right:10px" (click)="goBack()">Back</a>
    <button class="btn btn-primary" (click)="saveTTGroup()">Generate Canvas</button>
</div>
