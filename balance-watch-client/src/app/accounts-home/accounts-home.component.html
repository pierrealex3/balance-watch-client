<div class="container" style="margin-top: 20px">
    <div class="row">
        <div class="col-md-2 offset-md-8">
            <a *ngIf="keycloakService.isGroupAdmin()" class="btn btn-success" routerLink="/accountsMgmt">Group Accounts</a>
        </div>
        <div class="col-md-2">
            <a class="btn btn-primary" routerLink="/accountDetail/0">Add Account</a>                
        </div>
    </div>
    
</div>

<div class="container" style="margin-top: 20px">
        <table class="table table-hover table-striped">
            <thead>
                <tr>
                    <th>Account number</th>
                    <th>Account description</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let t of accountList; let i = index" (click)="onSelect(t)" [ngStyle]="{'font-weight': '500'}">
                    <td>{{t.accountNumber}}</td>
                    <td>{{t.desc}}</td>
                    <td><a class="btn btn-secondary btn-sm" routerLink="/accountDetail/{{t.id}}">Edit</a></td>
                </tr>
            </tbody>
        </table>
        
</div>
