<div class="container" style="margin-top: 20px">
    <div class="row">
        <div class="col-md-1">
            <label for="accSelId">Account</label>
        </div>
        <div class="col-md-4">
            <select id="accSelId" [(ngModel)]="sessionDataService.selectedAccount" (change)="getTransactions()" class="form-control">
                <option *ngFor="let a of accountList" [ngValue]="a">{{a.accountNumber}} - {{a.desc}}</option>
            </select>
        </div>
        <!-- <div><label>{{sessionDataService.selectedAccount?.id}}</label></div> -->
    </div>
    <div class="spacer10"></div>
    <div class="row">
        <div class="col-md-1">
            <label for="summaryYear">Year</label>            
        </div>
        <div class="col-md-1">
            <input id="summaryYear" [(ngModel)]="sessionDataService.summaryYear" class="form-control" style="width:65px"/>
        </div>
        <div class="col-md-1">
            <label for="summaryMonth">Month</label>            
        </div>
        <div class="col-md-1">
            <input id="summaryMonth" [(ngModel)]="sessionDataService.summaryMonth" (focusout)="getTransactions()" class="form-control" style="width:65px"/>
        </div>
        <div class="col-md-2 offset-md-6">
                <a class="btn btn-primary" routerLink="/tdetail/0" style="display: inline-block;vertical-align: middle;">Add Transaction</a>
        </div>
    </div>
</div>
<div class="container" style="margin-top: 20px">
    <table class="table table-hover table-striped table-dark">
        <thead>
            <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Debit|Credit</th>
                <th>Note #1</th>
                <th>Note #2</th>
                <th>Account</th>
                <th>Connection</th>
                <th>Balance</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let t of sortedTransactions; let i = index" (click)="onSelect(t)">
                <td [title]="t.date | date:'medium'"><a [ngStyle]="{'color': t.ttIdGen ? '#00d0ff' : '#007bff'}" routerLink="/tdetail/{{t.id}}">{{t.date | date:'fullDate'}}</a></td>
                <td><a [ngStyle]="{'color': t.ttIdGen ? '#00d0ff' : '#007bff'}" routerLink="/tdetail/{{t.id}}">{{t.type}}</a></td>
                <td><a [ngStyle]="{'color': t.ttIdGen ? '#00d0ff' : '#007bff'}" routerLink="/tdetail/{{t.id}}">{{t.amount | currency}}</a></td>
                <td><a [ngStyle]="{'color': t.ttIdGen ? '#00d0ff' : '#007bff'}" routerLink="/tdetail/{{t.id}}">{{t.way}}</a></td>
                <td><a [ngStyle]="{'color': t.ttIdGen ? '#00d0ff' : '#007bff'}" routerLink="/tdetail/{{t.id}}">{{t.note}}</a></td>
                <td><a [ngStyle]="{'color': t.ttIdGen ? '#00d0ff' : '#007bff'}" routerLink="/tdetail/{{t.id}}">{{t.noteXtra}}</a></td>
                <td><a [ngStyle]="{'color': t.ttIdGen ? '#00d0ff' : '#007bff'}" routerLink="/tdetail/{{t.id}}">{{t.account}}</a></td>
                <td><a [ngStyle]="{'color': t.ttIdGen ? '#00d0ff' : '#007bff'}" routerLink="/tdetail/{{t.id}}">{{t.accountConnection}}</a></td>
                <td [ngStyle]="{'background-color': balanceAtIndex(i) &lt; 0 ? 'red' : ''}">{{balanceAtIndex(i) | currency}}</td>
            </tr>
        </tbody>
    </table>
    
</div>
