<div class="form-group" style="margin-top: 20px">
        <div class="col-md-2">
            <label for="accSelId">Account</label>
        </div>
        <div class="col-md-2">
            <select id="accSelId" [(ngModel)]="sessionDataService.selAccount" class="form-control">
                <option value="ABC123">ABC123</option>
                <option value="UNME3U3">UNME3U3</option>
            </select>
        </div>
        <div class="col-md-2">
            <label for="summaryYear">Year</label>            
        </div>
        <div class="col-md-2">
            <input id="summaryYear" [(ngModel)]="sessionDataService.summaryYear" class="form-control" />
        </div>
        <div class="col-md-2">
            <label for="summaryMonth">Month</label>            
        </div>
        <div class="col-md-2">
            <input id="summaryMonth" [(ngModel)]="sessionDataService.summaryMonth" class="form-control" />
        </div>
</div>
<div>
    <table class="table table-hover table-striped table-dark">
        <thead>
            <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Debit|Credit</th>
                <th>Note #1</th>
                <th>Note #2</th>
                <th>Account</th>
                <th>Connection</th>
            </tr>
        </thead>

        <tr *ngFor="let t of transactions" (click)="onSelect(t)">
            <td [title]="t.date | date:'medium'"><a routerLink="/tdetail/{{t.id}}">{{t.date | date:'fullDate'}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.type}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.amount | currency}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.way}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.note}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.note2}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.account}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.accountConnection}}</a></td>
        </tr>

    </table>
    
</div>
