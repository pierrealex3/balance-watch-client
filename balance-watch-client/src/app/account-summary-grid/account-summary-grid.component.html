<div class="form-group" style="margin-top: 20px">
        <div class="col-md-2">
            <label for="accSelId">Account</label>
        </div>
        <div class="col-md-2">
            <select id="accSelId" class="form-control">
                <option selected value="ABC123">ABC123</option>
            </select>
        </div>
</div>
<div>
    <table class="table table-hover table-striped table-dark">
        <thead>
            <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Debit|Credit</th>
                <th>Note #1</th>
                <th>Note #2</th>
                <th>Account</th>
                <th>Connection</th>
            </tr>
        </thead>

        <tr *ngFor="let t of transactions" (click)="onSelect(t)">
            <td><a routerLink="/tdetail/{{t.id}}">{{t.date}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.type}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.amount}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.way}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.note}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.note2}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.account}}</a></td>
            <td><a routerLink="/tdetail/{{t.id}}">{{t.accountConnection}}</a></td>
        </tr>

    </table>
    
</div>
