<div class="container form-group" style="margin-top:15px">

<div>
    <label for="selAccountId">Build For Account</label>
    <select id="selAccountId" [(ngModel)]="sessionDataService.selectedAccount" (change)="fetchTransactionGroups()" class="form-control">
        <option *ngFor="let account of accountList" [ngValue]="account">{{account.accountNumber}} - {{account.desc}}</option>
    </select>
</div>
<div class="spacer20"></div>
<div *ngIf="sessionDataService.selectedAccount">
    <label>Transaction Canvas To Build From</label>
    <div>
        <a class="btn btn-primary" routerLink="/ttgroup/0" style="margin-right: 10px">Add</a>
        <button *ngIf="selGroup" class="btn btn-primary" (click)="editTtGroup()">Edit</button>
    </div>
</div>

<div class="spacer10"></div>
<div *ngIf="ttGroups.length > 0">
    <select [(ngModel)]="selGroup" class="form-control">
        <option [selected]="initSelTtGroup == ttg.id" *ngFor="let ttg of ttGroups" [ngValue]="ttg">
            {{ttg.data.description}}
        </option>
    </select>
</div>
<div class="spacer20"></div>
<div>
    <label for="tgtYearId">Target Year</label><input id="tgtYearId" [(ngModel)]="tgtYear" class="form-control" />
    <div class="spacer10"></div>
    <label for="tgtMonthId">Target Month</label>
    <select id="tgtMonthId" [(ngModel)]="tgtMonth" class="form-control">
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
    </select>
</div>
<div class="spacer20"></div>
<div>
    <a *ngIf="selGroup && sessionDataService.selectedAccount" class="btn btn-primary" [routerLink]="['/tsummary', {action: 'fetchData', selGroup: selGroup != undefined ? selGroup.id : '', forMonth: tgtMonth, forYear: tgtYear}]">Build</a>    
</div>
</div>
