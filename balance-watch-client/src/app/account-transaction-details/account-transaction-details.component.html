<div class="container form-group" style="margin-top:15px" *ngIf="transaction">
    
    <div>
        <label for="tdate">Date</label>
        <input placeholder="Day of month" id="tdate" #idate="ngModel" required type="text" class="form-control" [ngStyle]="{'border-color': idate.invalid && invalidSaveAttempt ? 'red' : null}" bsDatepicker [(ngModel)]="selDate" [minDate]="firstDayOfMonth" [maxDate]="lastDayOfMonth" />
        <label for="wtime" style="margin-right: 7px;">Time</label>
        <input [(ngModel)]="timeCheck" type="checkbox" id="wtime" />
        <div [hidden]="!timeCheck">
            <timepicker id="ttime" [(ngModel)]="selTime" [showMeridian]="false"></timepicker>
        </div>
    </div>
    <div>

    </div>
    <div>
        <label for="tdorc">Debit or Credit</label>
        <select id="tdorc" #iway="ngModel" required class="form-control" [ngStyle]="{'border-color': iway.invalid && invalidSaveAttempt ? 'red' : null}" [(ngModel)]="transaction.way" >
            <option value="DEBIT">Debit</option>
            <option value="CREDIT">Credit</option>
        </select>
    </div>
    <div>
        <label for="tamt">Amount</label>
        <input id="tamt" #iamt="ngModel" required class="form-control" [ngStyle]="{'border-color': iamt.invalid && invalidSaveAttempt ? 'red' : null}" [(ngModel)]="transaction.amount" />
    </div>
    <div>
        <label for="ttype">Type</label>
        <input id="ttype" #itype="ngModel" required class="form-control" [ngStyle]="{'border-color': itype.invalid && invalidSaveAttempt ? 'red' : null}" [(ngModel)]="transaction.type" />
    </div>
    <div>
        <label for="tnote1">Description</label>
        <input id="tnote1" class="form-control" [(ngModel)]="transaction.note" />
    </div>
    <div>
        <label for="tnote2">Note</label>
        <input id="tnote2" class="form-control" [(ngModel)]="transaction.noteXtra" />
    </div>
    <div>
        <label for="tconn">Account Connection</label>
        <select id="tconn" class="form-control" [(ngModel)]="connectedAccount">
            <option *ngFor="let a of otherAccounts" [ngValue]="a">{{a.accountNumber}} - {{a.desc}}</option>
        </select>
    </div>    
    <div style="margin-top:15px">
        <button class="btn btn-primary" style="margin-right:7px" (click)="goBack()">Back</button>
        <button class="btn btn-primary" style="margin-right:7px" *ngIf="editMode" (click)="update(idate, iway, iamt, itype)">Update</button>
        <button class="btn btn-danger" *ngIf="editMode" (click)="delete()">Delete</button>
        <button class="btn btn-primary" *ngIf="!editMode" (click)="add(idate, iway, iamt, itype)">Add</button>        
    </div>
</div>
