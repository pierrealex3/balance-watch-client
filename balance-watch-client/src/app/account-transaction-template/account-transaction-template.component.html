<p></p>
<div><label>Build for account:</label></div>
<select [(ngModel)]="selAccount">
    <option value="ABC123">ABC123</option>
</select>
<div></div>
<div><label>Use transaction template group:</label></div>
<a routerLink="/ttgroup/0">New</a>
<div *ngIf="ttGroups.length > 0">
    <select [(ngModel)]="selGroup">
        <option [selected]="initSelTtGroup == ttg.id" *ngFor="let ttg of ttGroups" [ngValue]="ttg">
            {{ttg.data.description}}
        </option>
    </select>
</div>
<br />
<p>
    <label for="tgtMonth">Month</label><input [(ngModel)]="tgtMonth" />
    <label for="tgtYear">Year</label><input [(ngModel)]="tgtYear" />
</p>
<p>
    <a [routerLink]="['/tsummary', {selGroup: selGroup != undefined ? selGroup.id : '', forMonth: tgtMonth, forYear: tgtYear}]">Build</a>
</p>
