<div class="spacer10"></div>
<div class="container">
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body" *ngIf="rService.usersFromAuthorizedGroup$ | async as users">
                    <h5 class="card-title">Select User</h5>

                    <div class="list-group" *ngFor="let user of users; let i = index">
                        <a [ngClass]="i === userActiveIdx ? 'active list-group-item list-group-item-action' : 'list-group-item list-group-item-action'" (click)="userSelected(user.id, i)">
                            {{user.id}}
                        </a>
                    </div>

                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body" *ngIf="rService.accountsFromAuthorizedGroup$ | async as accounts">
                    <h5 class="card-title">Select Account</h5>

                    <div class="list-group" *ngFor="let account of accounts; let i = index">
                        <a [ngClass]="i === accountActiveIdx ? 'active list-group-item list-group-item-action' : 'list-group-item list-group-item-action'" (click)="accountSelected(account.id, i)">
                            {{account.data.accountNumber}} | {{account.data.desc}}
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <div class="spacer10"></div>
    <div class="row">
        <div class="col-md-12">
            <div class="card" *ngIf="userAccountRights$ | async as accountRights">
                <div class="card-body">
                    <h5 class="card-title">Choose User Account Rights</h5>
                    <p class="card-text" *ngIf="accountRights.exists">Those are the existing rights.</p>
                    <p class="card-text" *ngIf="!accountRights.exists">The user does not have rights on this account at
                        the moment.</p>
                    <ul class="list-group">

                        <li class="list-group-item">
                            <span>Is Owner: <input type="checkbox" [(ngModel)]="accountRights.dto.isOwner" /></span>
                        </li>
                        <li class="list-group-item">
                            <span>Is Admin: <input type="checkbox" [(ngModel)]="accountRights.dto.isAdmin" /></span>
                        </li>
                        <li class="list-group-item">
                            <span>Is Transfer: <input type="checkbox"
                                    [(ngModel)]="accountRights.dto.isTransfer" /></span>
                        </li>
                        <li class="list-group-item">
                            <span>Is Read: <input type="checkbox" [(ngModel)]="accountRights.dto.isRead" /></span>
                        </li>
                    </ul>
                    <div class="spacer10"></div>
                    <a class="btn btn-primary" (click)="saveRights(accountRights)">Save</a>
                </div>
            </div>
        </div>
    </div>
    <div class="spacer10"></div>
    <div class="row">
        <div class="col-md-2">
            <a class="btn btn-primary" (click)="goBack()">Back</a>
        </div>
    </div>
</div>
